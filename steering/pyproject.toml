[project]
name = "steer"
version = "0.1.0"
description = "Steering vectors for the Planning Temporal Manifolds project: activations at the answer label, linear (CAA) and manifold-curve directions, and controls"
requires-python = ">=3.12"
dependencies = [
    "pbank[local]",        # the prompt bank's records, answer parser and local model runner (../prompt_bank)
    "numpy>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["steer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
pbank = { path = "../prompt_bank", editable = true }
torch = { index = "pytorch-cu128" }
