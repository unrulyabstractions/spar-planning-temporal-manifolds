[project]
name = "ptm"
version = "0.0.1"
description = "Planning Temporal Manifolds: activation capture and manifold analysis for time-horizon representations"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.10",
    "transformers>=5.2",
    "accelerate>=1.0",
    "safetensors>=0.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "plotly>=7.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ptm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
